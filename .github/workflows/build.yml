name: Build

on:
  push:
    branches: [ 0.39 ]
  pull_request:
    branches: [ 0.39 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('src-theme/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Setting up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Grant permissions to src-theme
        run: sudo chmod -R 777 src-theme
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/nextgen' }}
      - name: Build
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew build -x test -x detekt
      - name: Upload artifact
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          cd build/libs
          JAR=$(find . -regex '.*liquidbounce-[0-9.]*\.jar')
          if [ -z "$JAR" ]; then
            echo "[ERROR] built jar not found in build/libs" >&2
            exit 1
          fi
          cp $JAR zip/liquidbounce.jar
          cd zip
          zip -r liquidbounce.zip *
          md5sum liquidbounce.zip
          curl --connect-timeout 30 -m 300 -X POST -F "artifact=@liquidbounce.zip" \
            -H "Authorization: ${{ secrets.NIGHTLY_PASS }}" \
            -F "gh_id=${{ github.event.head_commit.id }}" \
            -F "gh_ref=${{ github.ref }}" \
            -F "gh_message=${COMMIT_MESSAGE}" \
            -F "gh_timestamp=${{ github.event.head_commit.timestamp }}" \
            -F "lb_version=0.39.0" \
            -F "mc_version=1.20.1" \
            -F "subsystem=fabric" \
            -F "jre_version=21" \
            -F "fabric_loader_version=0.14.21" \
            -F "fabric_api_version=0.89.3+1.20.1" \
            -F "kotlin_version=1.9.0" \
            -F "fabric_kotlin_version=1.10.19+kotlin.1.9.0" \
            https://api.liquidbounce.net/api/v1/version/new
